<g fill="#d9e3f2" font-size="14"><text x="880" y="187">One cross-chat queue</text><text x="901" y="225">Review the draft</text><text x="901" y="263" fill="#8498b5">Confirm the script</text></g>
<rect x="880" y="213" width="13" height="13" rx="3" fill="none" stroke="#94a9c8"/><rect x="880" y="251" width="13" height="13" rx="3" fill="#91aacf"/><path d="m883 257 3 3 4-5" fill="none" stroke="#142035" stroke-width="1.5"/>
<text x="38" y="328" font-size="11" fill="#8094b4">Read the original. Correct the category. Keep control.</text>

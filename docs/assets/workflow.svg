<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="350" viewBox="0 0 1120 350" role="img" aria-labelledby="title desc">
<title id="title">Work with Jev — messages in, priorities out</title><desc id="desc">Illustrative workflow: work messages are classified into urgent, to-do, useful and skip; selected items are saved to a cross-chat queue.</desc>
<rect width="1120" height="350" rx="20" fill="#111b2b"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
<text x="38" y="42" font-size="12" letter-spacing="2" fill="#91a6c8">WORK WITH JEV</text>
<text x="38" y="87" font-size="29" font-weight="600" fill="#f3f7ff">Messages in. Priorities out.</text>
<text x="1082" y="40" text-anchor="end" font-size="11" fill="#91a6c8">WORKFLOW · NOT A LIVE RESULT</text>
<g font-size="14" fill="#b4c3da"><text x="38" y="132">01 / Choose a chat</text><text x="329" y="132">02 / Sort with Jev</text><text x="859" y="132">03 / Keep &amp; complete</text></g>
<rect x="38" y="152" width="238" height="148" rx="10" fill="#1b293f" stroke="#314158"/>
<g fill="#d9e3f2" font-size="14"><text x="56" y="184">Which messages need me?</text><text x="56" y="222" fill="#a8b9d1">Project group</text><text x="56" y="251" fill="#a8b9d1">Team updates</text><text x="56" y="280" fill="#a8b9d1">Shared resources</text></g>
<path d="M290 226h24m-7-5 7 5-7 5" fill="none" stroke="#728bb1" stroke-width="1.5"/>
<g><rect x="329" y="152" width="229" height="65" rx="9" fill="#34252d" stroke="#5d3a42"/><rect x="572" y="152" width="229" height="65" rx="9" fill="#332e22" stroke="#584c32"/><rect x="329" y="231" width="229" height="69" rx="9" fill="#1c304b" stroke="#354e70"/><rect x="572" y="231" width="229" height="69" rx="9" fill="#232e3d" stroke="#3a475b"/></g>
<g font-size="18" font-weight="550"><text x="347" y="191" fill="#f3b3b1">Urgent</text><text x="590" y="191" fill="#edcc8c">My tasks</text><text x="347" y="272" fill="#a9ccff">Worth reading</text><text x="590" y="272" fill="#b6c1d1">Skip for now</text></g>
